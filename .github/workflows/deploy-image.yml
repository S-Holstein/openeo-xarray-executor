name: Build and Push Branch Images

on:
  push:
    # "*" sorgt dafür, dass der Workflow bei Pushes auf JEDEN Branch startet
    branches:
      - '*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # Wenn Push auf 'main', wird das Image 'latest' getaggt
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # Für alle anderen Pushes wird der Branch-Name als Tag genutzt (z.B. :feature-login)
            type=ref,event=branch

      # Das Docker-Image wird nun mit dem dynamischen Branch-Tag gebaut und gepusht
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

